<button
  class="text-sm font-medium customBtn"
  mat-icon-button
  color="secondary"
  id="coords"
  (click)="toggleCoords()"
  [matTooltip]="isActive ? 'Cancel' : 'Get Coordinates'"
  matTooltipPosition="below"
>
  <mat-icon *ngIf="!isActive" svgIcon="mat:push_pin"></mat-icon>
  <mat-icon *ngIf="isActive" svgIcon="mat:cancel"></mat-icon>
</button>
