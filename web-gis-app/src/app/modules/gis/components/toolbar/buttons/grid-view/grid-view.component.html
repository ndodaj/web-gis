<button
  class="text-sm font-medium customBtn"
  mat-icon-button
  color="secondary"
  id="graticuleButton"
  (click)="toggleGridView()"
  [matTooltip]="isActive ? 'Hide Grid' : 'Show Grid'"
  matTooltipPosition="below"
>
  <mat-icon *ngIf="!isActive" svgIcon="mat:grid_view"></mat-icon>
  <mat-icon *ngIf="isActive" svgIcon="mat:cancel"></mat-icon>
</button>
