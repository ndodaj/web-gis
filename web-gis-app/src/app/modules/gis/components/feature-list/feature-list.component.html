<div class="flex items-center space-x-4 mb-1 mt-4 ml-4">
  <!-- Layer Dropdown -->
  <mat-form-field appearance="outline" class="w-64">
    <mat-label>Select Layer</mat-label>
    <mat-select
      [(value)]="selectedLayer"
      (selectionChange)="onLayerSelect($event.value)"
    >
      <mat-option *ngFor="let layer of layers" [value]="layer">
        {{ layer.get("title") || "Unnamed Layer" }}
      </mat-option>
    </mat-select>
  </mat-form-field>
</div>

<div class="flex items-center space-x-2 mb-4">
  <!-- Options Menu Button -->
  <button
    mat-button
    [matMenuTriggerFor]="optionsMenu"
    class="flex items-center space-x-2"
  >
    <mat-icon>menu</mat-icon>
    <span>Options</span>
  </button>
  <button mat-button class="flex items-center space-x-2">
    <mat-icon>filter_alt</mat-icon>
    <span>Filter by map extent</span>
  </button>
  <button mat-button (click)="refresh()" class="flex items-center space-x-2">
    <mat-icon>refresh</mat-icon>
    <span>Refresh</span>
  </button>
</div>

<!-- Options Menu -->
<mat-menu #optionsMenu="matMenu">
  <button mat-menu-item (click)="openFilterDialog()">
    <mat-icon>filter_list</mat-icon>
    <span>Filter</span>
  </button>
  <button mat-menu-item [matMenuTriggerFor]="columnMenu">
    <mat-icon>view_column</mat-icon>
    <span>Show/Hide columns</span>
  </button>
</mat-menu>

<!-- Column Menu for Show/Hide Columns -->
<mat-menu #columnMenu="matMenu">
  <mat-checkbox
    *ngFor="let column of displayedColumns"
    [(ngModel)]="column.visible"
  >
    {{ column.label }}
  </mat-checkbox>
</mat-menu>

<!-- Table -->
<div class="overflow-y-auto max-h-96">
  <table
    @stagger
    mat-table
    [dataSource]="dataSource"
    matSort
    class="w-full mat-elevation-z8"
  >
    <!-- Dynamic Column Definitions -->
    <ng-container *ngFor="let column of visibleColumns" [matColumnDef]="column">
      <th mat-header-cell *matHeaderCellDef class="bg-gray-100 px-4 py-2">
        {{ column | titlecase }}
      </th>
      <td mat-cell *matCellDef="let element" class="px-4 py-2">
        <!-- Check if row is in edit mode -->
        <ng-container *ngIf="editingRow === element; else displayValue">
          <input
            [(ngModel)]="element[column]"
            class="border rounded px-2 py-1 w-full"
            type="text"
          />
        </ng-container>
        <ng-template #displayValue>
          {{ element[column] }}
        </ng-template>
      </td>
    </ng-container>

    <!-- Actions Column -->
    <ng-container matColumnDef="actions" stickyEnd>
      <th mat-header-cell *matHeaderCellDef class="bg-gray-100 px-4 py-2"></th>
      <td mat-cell *matCellDef="let row" class="px-4 py-2">
        <!-- Show Save/Cancel if editing -->
        <ng-container *ngIf="editingRow === row; else defaultActions">
          <button
            class="bg-green-500 text-white px-3 py-1 rounded mr-2"
            (click)="saveRow(row)"
          >
            Save
          </button>
          <button
            class="bg-gray-500 text-white px-3 py-1 rounded"
            (click)="cancelEdit()"
          >
            Cancel
          </button>
        </ng-container>
        <ng-template #defaultActions>
          <button
            mat-button
            class="bg-blue-500 text-white px-3 py-1 rounded mr-2"
            (click)="editRow(row)"
          >
            Edit
          </button>
          <button
            mat-button
            class="bg-red-500 text-white px-3 py-1 rounded"
            (click)="deleteRow(row)"
          >
            Delete
          </button>
        </ng-template>
      </td>
    </ng-container>

    <!-- Header and Row Declarations -->
    <tr
      mat-header-row
      *matHeaderRowDef="visibleColumns.concat(['actions']); sticky: true"
    ></tr>
    <tr
      mat-row
      class="hover:bg-hover trans-ease-out"
      [class.bg-hover]="row === selectedRow"
      *matRowDef="let row; columns: visibleColumns.concat(['actions'])"
      (dblclick)="onRowClick(row)"
    ></tr>
  </table>
</div>
