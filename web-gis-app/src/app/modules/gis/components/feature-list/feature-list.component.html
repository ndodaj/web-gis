<div class="flex items-center space-x-2 mb-4 pt-4">
  <!-- Options Menu Button -->
  <button
    mat-button
    [matMenuTriggerFor]="optionsMenu"
    class="flex items-center space-x-2"
  >
    <mat-icon>menu</mat-icon>
    <span>Options</span>
  </button>
  <button mat-button class="flex items-center space-x-2">
    <mat-icon>filter_alt</mat-icon>
    <span>Filter by map extent</span>
  </button>
  <button mat-button>
    <mat-icon>pin_drop</mat-icon>
    <span>Zoom to</span>
  </button>
  <button mat-button type="button">
    <mat-icon>clear</mat-icon>
    <span>Clear selection</span>
  </button>
  <button mat-button>
    <mat-icon>refresh</mat-icon>
    <span>Refresh</span>
  </button>
</div>

<!-- Options Menu -->
<mat-menu #optionsMenu="matMenu">
  <button mat-menu-item>
    <mat-icon>check_box</mat-icon>
    <span>Show selected records</span>
  </button>
  <button mat-menu-item (click)="openFilterDialog()">
    <mat-icon>filter_list</mat-icon>
    <span>Filter</span>
  </button>
  <button mat-menu-item [matMenuTriggerFor]="columnMenu">
    <mat-icon>view_column</mat-icon>
    <span>Show/Hide columns</span>
  </button>
</mat-menu>

<!-- Column Menu for Show/Hide Columns -->
<mat-menu #columnMenu="matMenu">
  <mat-checkbox
    *ngFor="let column of displayedColumns"
    [(ngModel)]="column.visible"
  >
    {{ column.label }}
  </mat-checkbox>
</mat-menu>

<!-- Table -->
<div class="overflow-auto max-h-96">
  <table
    @stagger
    mat-table
    [dataSource]="dataSource"
    matSort
    class="w-full mat-elevation-z8"
  >
    <!-- Dynamic Column Definitions -->
    <ng-container *ngFor="let column of visibleColumns" [matColumnDef]="column">
      <th mat-header-cell *matHeaderCellDef class="bg-gray-100 px-4 py-2">
        <div class="flex items-center gap-2">
          <button
            mat-icon-button
            [matMenuTriggerFor]="menu"
            aria-label="Filter"
            class="ml-2"
          >
            <mat-icon>filter_alt</mat-icon>
          </button>
          <mat-menu #menu="matMenu" class="matMenu">
            <ng-template matMenuContent>
              <div
                class="px-6 pt-4 pb-0 flex flex-col"
                (click)="$event.stopPropagation()"
                aria-hidden="true"
              >
                <mat-form-field appearance="outline" class="w-50">
                  <input
                    matInput
                    placeholder="Filter {{ column }}"
                    (keyup)="applyColumnFilter(column, $event)"
                  />
                </mat-form-field>
              </div>
            </ng-template>
          </mat-menu>
          <span mat-sort-header>{{ column | titlecase }}</span>
        </div>
      </th>
      <td mat-cell *matCellDef="let element" class="px-4 py-2">
        {{ element[column] }}
      </td>
    </ng-container>

    <ng-container matColumnDef="actions" stickyEnd>
      <th *matHeaderCellDef mat-header-cell></th>
      <td mat-cell *matCellDef="let row" class="px-4 py-2">
        <button
          (click)="$event.stopPropagation()"
          [matMenuTriggerData]="{ data: row }"
          [matMenuTriggerFor]="actionsMenu"
          mat-icon-button
          type="button"
        >
          <mat-icon>more_vert</mat-icon>
        </button>
      </td>
    </ng-container>

    <!-- Header and Row Declarations -->
    <tr
      mat-header-row
      *matHeaderRowDef="visibleColumns.concat(['actions']); sticky: true"
    ></tr>
    <tr
      mat-row
      *matRowDef="let row; columns: visibleColumns.concat(['actions'])"
    ></tr>
  </table>
</div>
<mat-menu #actionsMenu="matMenu" xPosition="before" yPosition="below">
  <ng-template let-data="data" matMenuContent>
    <button mat-menu-item (click)="reset(data)">
      <mat-icon svgIcon="mat:edit"></mat-icon>
      <span>Edit</span>
    </button>
    <button mat-menu-item>
      <mat-icon svgIcon="mat:delete"></mat-icon>
      <span>Delete</span>
    </button>
  </ng-template>
</mat-menu>
